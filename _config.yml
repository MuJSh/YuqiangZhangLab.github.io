# Site settings
title: "Yuqiang Zhang Lab"
email: "Yuqiang.Zhang@sdu.edu.cn"
description: >
  The Yuqiang Zhang Lab at Shandong University studies atmospheric chemistry,
  air quality, climate interactions, environmental health, and data-driven
  approaches for understanding air pollution and its impacts.

# GitHub Pages settings
url: "https://mujsh.github.io"
baseurl: "/YuqiangZhangLab.github.io"

include:
  - .htaccess
  - _pages

sass:
  sass_dir: _sass

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true
